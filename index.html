<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes App</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  
  <body>
    <header>
      <h1>QuickNotes</h1>
      <p>Capture and organize your ideas effortlessly.</p>
    </header>

    <main>
      <section>
        <h2>Add a note</h2>
        <form id="note-form">
          <div class="form-group">
            <label for="note-input">New note</label>
            <input type="text" id="note-input" placeholder="Type a note..." />
          </div>
          <div class="form-group">
            <label for="note-category">Category</label>
            <select id="note-category">
              <option value="personal">Personal</option>
              <option value="work">Work</option>
              <option value="study">Study</option>
            </select>
          </div>
          <button type="submit">Add Note</button>
        </form>
        <p id="error-message"></p>
      </section>

      <section>
        <h2>Your notes</h2>
        <div class="search-container">
          <input type="text" id="search-input" placeholder="Search notes..." />
        </div>
        <p id="note-count">You have no notes yet.</p>
        <ul id="notes-list"></ul>
        <button id="clear-all-btn" type="button" style="display: none;">Clear All</button>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 QuickNotes App. Built for Web Foundations.</p>
    </footer>
  </body>
</html>
